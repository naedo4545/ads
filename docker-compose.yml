version: '3.8'

services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - .env.local
    depends_on:
      - db
    restart: unless-stopped

  # PostgreSQL Database with pgvector
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ads_transparency
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Crawler Service
  crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    environment:
      - NODE_ENV=production
    env_file:
      - .env.local
    depends_on:
      - db
    restart: unless-stopped
    profiles:
      - crawler

  # AI Worker Service
  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile.ai-worker
    environment:
      - NODE_ENV=production
    env_file:
      - .env.local
    depends_on:
      - db
      - redis
    restart: unless-stopped
    profiles:
      - ai-worker

volumes:
  postgres_data:
  redis_data:
